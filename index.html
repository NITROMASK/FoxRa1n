<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FoxRa1n Repo</title>
<style>
  * {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
  }

  body {
    background-color: #0b0b0d;
    color: #f5f5f5;
    font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    padding: 60px 10px;
    margin: 0;
  }


  .header-container {
    text-align: center;
    margin-bottom: 0.5em;
  }

  h1 {
    display: inline-block;
    vertical-align: middle;
    font-size: 2.5em;
    color: #ff4757;
    text-shadow: 0 0 15px rgba(255, 71, 87, 0.7);
    margin: 0;
  }

  .logo-highlight {
    color: #ff7b00;
  }


  .header-image {
    display: inline-block;
    vertical-align: middle;
    width: 64px;
    height: 64px;
    margin-left: 15px;
    border-radius: 12px;
    background-image: url("https://github.com/NITROMASK/FoxRa1n/blob/main/CydiaIcon.png?raw=true");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  p {
    color: #bbb;
    margin-bottom: 2em;
  }

  /* ---- Button row: text-align + inline-block buttons instead of
     flex with gap/wrap. Inline-block wraps naturally like text. ---- */
  .repo-buttons {
    text-align: center;
  }

  .repo-buttons a {
    display: inline-block;
    vertical-align: middle;
    background: rgba(15, 15, 20, 0.9);
    border: 1px solid #00aaff;
    border-radius: 8px;
    padding: 8px 16px;
    margin: 4px;
    color: #00aaff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    -webkit-transition: 0.2s;
    transition: 0.2s;
    min-width: 120px;
  }

  .repo-buttons a:hover {
    background: #00aaff;
    color: #fff;
    box-shadow: 0 0 10px #00aaff;
  }

  .repo-buttons img {
    display: inline-block;
    vertical-align: middle;
    width: 20px;
    height: 20px;
    margin-right: 6px;
    border-radius: 4px;
  }

  footer {
    margin-top: 3em;
    font-size: 0.8em;
    color: #666;
  }
</style>
</head>
<body>
  <div class="header-container">
    <h1>Fox<span class="logo-highlight">Ra1n</span></h1>
    <span class="header-image" role="img" aria-label="FoxRa1n Logo"></span>
  </div>

  <p>iOS 5-9 Cydia Repository by <strong>Maskie</strong></p>

  <div class="repo-buttons">
    <a
      href="cydia://url/https://cydia.saurik.com/api/share#?source=https://foxra1n.maskie.workers.dev"
      ><img
        src="https://github.com/NITROMASK/FoxRa1n/blob/main/imgs/cydia.png?raw=true"
        alt="Cydia Icon"
    />Cydia</a>

  </div>

  <footer>
    <p>© 2025-2026 FoxRa1n • Hosted on GitHub Pages</p>
  </footer>
</body>
</html>
